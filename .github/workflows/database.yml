name: Database integration checks
on: [workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, pg]
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: risk_monitor_test
          MYSQL_USER: demo_user
          MYSQL_PASSWORD: local_test_only
          MYSQL_ROOT_PASSWORD: local_root_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal_root_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: ${{ matrix.database == 'pg' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: risk_monitor_test
          POSTGRES_USER: demo_user
          POSTGRES_PASSWORD: local_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U demo_user -d risk_monitor_test"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: investment-risk-monitor-unified
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RUN_DB_INTEGRATION: '1'
      DB_TYPE: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'mysql' && '3306' || '5432' }}
      DB_NAME: risk_monitor_test
      DB_USER: demo_user
      DB_PASSWORD: local_test_only
      DB_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-import.txt
      - run: python -m unittest discover -s integration_tests -v
      - run: python -m unittest discover -s adapter_tests -v
