name: Offline portfolio checks
on: [workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  publishable-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Privacy and syntax checks across the repository
        run: python scripts/check_publishable_tree.py
  project:
    name: ${{ matrix.project }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        project:
          - investment-risk-monitor-unified
          - wealth-agent
          - business-analytics-agent
          - database-job-mutex
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ENABLE_EXTERNAL_SERVICES: 'false'
      ENABLE_HISTORY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax and privacy-pattern checks
        run: python scripts/check_privacy.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic demo
        run: python demo.py
