version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directories:
      - /wealth-agent
      - /business-analytics-agent
      - /investment-risk-monitor-unified
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /business-analytics-agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
