name: Service and browser checks
on: [workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        project: [wealth-agent, business-analytics-agent]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      ENABLE_EXTERNAL_SERVICES: 'false'
      ENABLE_HISTORY: 'false'
      ENABLE_CODE_EXECUTION: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements*.txt
      - run: python -m pip install -r requirements.txt
      - if: matrix.project == 'wealth-agent'
        run: python -m pip install -r requirements-speech.txt
      - run: python -m pip check
      - run: python -m unittest discover -s service_tests -v
      - if: matrix.project == 'wealth-agent'
        run: python evals/evaluate_contracts.py
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt pydantic==2.11.3
      - run: python scripts/check_quality.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: business-analytics-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: pnpm exec playwright install --with-deps chromium
      - run: python -m pip install -r requirements.txt
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: business-analytics-agent/test-results/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [wealth-agent, business-analytics-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project }}
          load: true
          tags: portfolio-service
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}
      - name: Check the service health endpoint
        shell: bash
        run: |
          docker run -d --name portfolio-service -p 8000:8000 portfolio-service
          trap 'docker logs portfolio-service; docker rm -f portfolio-service' EXIT
          # Docker may accept the connection before the application starts listening.
          curl --fail --show-error --silent --retry 15 --retry-all-errors \
            --retry-delay 2 --retry-max-time 60 --max-time 5 http://localhost:8000/healthz
